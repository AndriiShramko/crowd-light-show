# lightshow-game — Фаза A (nginx статика + limit_rate) + Фазы B/C (Node WS-сервер, internal).
# Деплой: /home/fpv/lightshow-game/. Секреты — config.env (chmod 600, НЕ в git). Сеть web-proxy — external.
services:
  lightshow-game:
    # Пин по digest (снят с сервера 2026-07-12); тег-комментарий: 1.27-alpine
    image: nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    container_name: lightshow-game
    environment:
      - VIRTUAL_HOST=game.flyreelstudio.eu
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=game.flyreelstudio.eu
      - LETSENCRYPT_EMAIL=zmei116@gmail.com
      - GAME_ENABLED=1
    volumes:
      - ./app:/srv/app:ro
      - ./worlds:/srv/worlds:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro   # поднятые worker_connections/nofile под WS-толпу
    expose:
      - "8080"
    networks:
      - web-proxy
      - game-net
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: 256m
    pids_limit: 256
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - lightshow-game-ws
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  lightshow-game-ws:
    image: node:20-alpine
    container_name: lightshow-game-ws
    working_dir: /srv/ws
    command: ["node", "server.js"]
    env_file: ./config.env      # GAME_SESSION_SECRET (chmod 600, не в git)
    environment:
      - PORT=8081
      - NODE_ENV=production
      - DATA_DIR=/srv/data
      - GAME_ENABLED=1
    volumes:
      - ./ws:/srv/ws:ro          # node_modules лежит внутри ws/ (read_only rootfs не даёт mount в несущ. точку)
      - ./static/worlds:/srv/static/worlds:ro
      - game-data:/srv/data
    expose:
      - "8081"
    networks:
      - game-net
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 512
    cpus: 2.0
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  web-proxy:
    external: true
  game-net: {}

volumes:
  game-data: {}
