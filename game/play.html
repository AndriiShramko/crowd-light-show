<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Cat Conga</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#07080c;color:#e8e6df;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;touch-action:none}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:fixed;z-index:5;pointer-events:none}
  #top{top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center}
  #top span{background:rgba(10,12,18,.6);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px 14px;font-size:13px}
  #hint{top:calc(46px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;font-size:12px;opacity:.75}
  /* джойстик */
  #joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);z-index:6;touch-action:none}
  #knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffc93c;box-shadow:0 0 14px rgba(255,201,60,.5)}
  /* правые кнопки */
  #btns{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:6}
  #btns button{width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(20,22,30,.72);color:#e8e6df;font-size:22px}
  #btns button:active{background:#ffc93c;color:#1b1400}
  /* чат-панель */
  #chatbar{position:fixed;left:0;right:0;bottom:calc(160px + env(safe-area-inset-bottom));display:none;justify-content:center;z-index:7}
  #chatbar.show{display:flex}
  #chatgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(10,12,18,.9);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;max-width:92vw}
  #chatgrid button{border:0;border-radius:9px;padding:9px 10px;background:rgba(255,255,255,.08);color:#e8e6df;font-size:13px}
  /* identify overlay */
  #ident{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;animation:blink 1s steps(1) infinite}
  #ident.show{display:flex}
  #ident b{font-size:26vw;font-weight:800;color:#07080c;text-shadow:0 2px 20px rgba(0,0,0,.3)}
  #ident small{font-size:5vw;color:#07080c;opacity:.7}
  @keyframes blink{0%,50%{filter:brightness(1)}51%,100%{filter:brightness(.55)}}
  #idclose{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:21;display:none;background:rgba(0,0,0,.3);border:0;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px}
  #idclose.show{display:block}
  /* toast */
  #toast{position:fixed;left:0;right:0;top:40%;text-align:center;z-index:15;pointer-events:none}
  #toast span{display:inline-block;background:rgba(255,201,60,.95);color:#1b1400;font-weight:700;font-size:20px;padding:10px 22px;border-radius:12px;opacity:0;transform:scale(.8);transition:.3s}
  #toast span.show{opacity:1;transform:scale(1)}
  #loader{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#07080c;z-index:30;transition:opacity .4s}
  #loader.hidden{opacity:0;pointer-events:none}
  .cat{font-size:44px;animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px) rotate(-4deg)}}
  #err{position:fixed;inset:0;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#07080c;z-index:40;text-align:center;padding:24px}
  #err.show{display:flex}#err button{background:#ffc93c;color:#1b1400;border:0;border-radius:10px;padding:12px 26px;font-weight:600}
</style>
</head>
<body data-mode="loading">
  <div id="stage"></div>
  <div class="hud" id="top"><span id="status">Cat Conga</span></div>
  <div class="hud" id="hint">find the tail — walk into it to latch on</div>
  <div id="joy"><div id="knob"></div></div>
  <div id="btns">
    <button id="bChat" title="chat">💬</button>
    <button id="bPurr" title="purr">🐾</button>
    <button id="bId" title="identify me">🔦</button>
    <button id="bMap" title="zoom out">🗺️</button>
  </div>
  <div id="chatbar"><div id="chatgrid"></div></div>
  <div id="ident"><b id="idnum">1</b><small>show this — your chain-mates will find you</small></div>
  <button id="idclose">✕ close</button>
  <div id="toast"><span id="toastmsg"></span></div>
  <div id="loader"><div class="cat">🐈‍⬛</div><div id="loadmsg">joining the crowd…</div></div>
  <div id="err"><div class="cat">🙀</div><div><strong>Couldn't join.</strong></div><button id="retry">Retry</button></div>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/three-addons/","@sparkjsdev/spark":"./vendor/spark.module.min.js"}}</script>
  <script type="module" src="./play.js"></script>
</body>
</html>
